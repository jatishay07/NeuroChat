# gitleaks config: the default rules, minus third-party bundles and recorded Bluetooth packets
# (long hex strings that look like keys but aren't).
[extend]
useDefault = true

[allowlist]
description = "Vendored third-party code and binary test fixtures"
paths = [
  '''^portal/vendor/''',
  '''^portal/web/''',
  '''^tests/fixtures/''',
]
