# Builds the all-in-one image (app + Ollama + Qwen model + Open WebUI) and checks that it works.
# On main it publishes ghcr.io/jatishay07/neurochat for Intel/AMD and Apple Silicon/ARM.
name: Docker image

on:
  push:
    branches: [main]
  pull_request:
    paths: [Dockerfile, docker/**, companion/**, portal/**, pyproject.toml, .github/workflows/docker.yml]
  workflow_dispatch:

# A newer push to the same branch replaces a build still running, so main publishes its latest commit.
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/jatishay07/neurochat

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        exclude:
          - arch: ${{ github.event_name == 'pull_request' && 'arm64' || 'none' }}
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space (the image is about 10 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af >/dev/null
          df -h /
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        if: matrix.arch != 'amd64'
      - name: Build
        run: docker build --platform linux/${{ matrix.arch }} -t "$IMAGE:latest-${{ matrix.arch }}" .
      - name: Check the model is inside
        run: |
          docker run --rm --platform linux/${{ matrix.arch }} --entrypoint sh "$IMAGE:latest-${{ matrix.arch }}" -c \
            'ollama serve >/dev/null 2>&1 & until ollama list >/dev/null 2>&1; do sleep 1; done; ollama list | tee /dev/stderr | grep -q "^$NEUROCHAT_MODEL "'
      - name: Start it and ask the model something
        if: matrix.arch == 'amd64'
        run: |
          docker run -d --name nc -p 8765:8765 -p 3000:3000 "$IMAGE:latest-amd64"
          for i in $(seq 60); do
            curl -fs localhost:3000/health >/dev/null && curl -fs localhost:8765/api/tutor | grep -q '"ready":true' && break
            sleep 5
          done
          curl -fsS localhost:8765/api/tutor; echo
          curl -fsS localhost:3000/health; echo
          curl -fsS -o /dev/null localhost:8765/eyes.html
          docker exec nc curl -fsS localhost:11434/api/chat -d \
            '{"model":"qwen3.5:4b","stream":false,"think":false,"messages":[{"role":"user","content":"Say hello in five words."}]}'
      - name: Engagement score reaches the real model, end to end
        if: matrix.arch == 'amd64'
        run: docker exec -w /opt/neurochat nc .venv/bin/python -m companion.e2e --ollama http://127.0.0.1:11434
      - name: Logs
        if: failure()
        run: docker logs nc 2>&1 | tail -100 || true
      - name: Push
        if: github.event_name != 'pull_request'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$IMAGE:latest-${{ matrix.arch }}"

  publish:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: One tag for both architectures
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker buildx imagetools create -t "$IMAGE:latest" "$IMAGE:latest-amd64" "$IMAGE:latest-arm64"
