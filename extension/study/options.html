<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NeuroChat study mode</title>
  <style>
    :root { --ink: #0b0d12; --muted: #5b616e; --line: rgba(11, 13, 18, .08); --amber: #e58a00; }
    body { margin: 0; padding: 40px 20px 60px; font: 15px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, "Segoe UI", system-ui, sans-serif; color: var(--ink);
      background: radial-gradient(1200px 600px at 10% -10%, #eef3ff, transparent), radial-gradient(900px 500px at 110% 10%, #fff2e6, transparent), #f7f8fb; }
    main { max-width: 640px; margin: 0 auto; }
    h1 { font-size: 26px; letter-spacing: -.02em; margin: 0 0 4px; }
    .lede { color: var(--muted); margin: 0 0 24px; }
    .card { background: rgba(255, 255, 255, .78); border: 1px solid rgba(255, 255, 255, .9); border-radius: 18px; box-shadow: 0 16px 50px rgba(20, 30, 60, .08); padding: 4px 18px; margin-bottom: 18px; }
    h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 24px 4px 8px; }
    label { display: grid; grid-template-columns: 1fr auto; gap: 2px 16px; padding: 14px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
    label:last-child { border-bottom: 0; }
    label b { font-weight: 600; }
    label span { grid-column: 1; color: var(--muted); font-size: 13.5px; }
    label em { font-style: normal; color: var(--amber); }
    input { grid-column: 2; grid-row: 1 / span 2; align-self: center; width: 40px; height: 24px; appearance: none; border-radius: 999px; background: #d9dce3; position: relative; cursor: pointer; transition: background .2s; }
    input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .2); transition: left .2s; }
    input:checked { background: var(--ink); }
    input:checked::after { left: 19px; }
    input:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
    .fine { color: var(--muted); font-size: 13px; margin: 18px 4px; }
    button { font: inherit; border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 7px 14px; cursor: pointer; }
  </style>
</head>
<body>
<main>
  <h1>Study mode</h1>
  <p class="lede">Turn it on from any page: right-click › <b>Study this page</b>, or Alt+Shift+S. Every feature below has its own switch.</p>
  <div id="groups"></div>
  <p class="fine">Your reading times, labels and review questions stay in this browser. <button type="button" id="reset">Forget my reading history</button> <span id="said"></span></p>
</main>
<script src="options.js"></script>
</body>
</html>
