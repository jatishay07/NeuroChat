<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NeuroChat · Connect your headset</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <p class="eyebrow">Step 1 of 3</p>
    <h1>Connect your headset</h1>
    <p class="lede">Turn on your Muse S Athena, put it on, and keep it near this computer. Close the Muse app first, since the headset can only talk to one app at a time.</p>

    <section id="find">
      <button id="scanBtn" type="button" class="primary">Find my headset</button>
      <ul id="devices" class="devices" aria-live="polite"></ul>
    </section>

    <section id="live" hidden>
      <div class="connected">
        <span class="dot" id="liveDot"></span>
        <span id="deviceName"></span>
        <span class="muted" id="rate"></span>
        <button id="disconnectBtn" type="button">Disconnect</button>
      </div>
      <h2>Sensor check</h2>
      <p class="muted">Each sensor needs to touch skin. Green means it's reading cleanly.</p>
      <svg id="head" viewBox="0 0 220 200" role="img" aria-label="Top view of a head showing the four sensors">
        <ellipse cx="110" cy="105" rx="78" ry="88" class="skull"/>
        <path d="M100 18 L110 6 L120 18" class="nose"/>
        <ellipse cx="28" cy="110" rx="9" ry="20" class="ear"/>
        <ellipse cx="192" cy="110" rx="9" ry="20" class="ear"/>
        <g id="sensors"></g>
      </svg>
      <ul id="tips" class="tips"></ul>
      <button id="continueBtn" type="button" class="primary" disabled>Continue to calibration</button>
    </section>

    <p id="message" class="message" role="status"></p>
  </main>
  <script src="app.js"></script>
</body>
</html>
