<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NeuroChat · Tutor</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="tutor.css">
</head>
<body>
  <!-- The tutor without the headset or eye tracking. /chat opens Open WebUI instead when it's running. -->
  <header class="top">
    <span class="brand">NeuroChat</span>
  </header>
  <main class="card chat-card">
    <h1>Ask the tutor</h1>
    <p class="lede">Paste a passage you're stuck on or ask a question. The answer comes from the model on this computer.</p>
    <section id="tutor" class="tutor" aria-live="polite">
      <p id="tutorStatus" class="muted small"></p>
      <div id="offer" class="offer" hidden>
        <p id="offerText"></p>
        <div class="row">
          <button id="offerYes" type="button" class="primary">Explain it</button>
          <button id="offerNo" type="button" class="quiet">Not now</button>
        </div>
      </div>
      <div id="chat" class="chat"></div>
      <form id="askForm" class="ask">
        <input id="askInput" type="text" placeholder="Ask anything…" autocomplete="off" aria-label="Ask the tutor">
        <button id="askBtn" type="submit" class="primary" aria-label="Send">&#8593;</button>
      </form>
    </section>
    <p class="skip muted"><a href="/">Connect the headset</a> · <a href="/eyes.html">Eye tracking</a></p>
  </main>
  <script src="tutor.js"></script>
</body>
</html>
